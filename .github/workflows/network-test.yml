name: Two-instance networking verification

# Milestone 14's actor-level network transport (SYS_NET_SEND/RECEIVE,
# CAP_NET, actor_network_peer -- see docs/MILESTONE14_CHANGELOG.md) was
# verified within a single QEMU instance, but genuine cross-instance
# verification was blocked by qemu-system-x86_64.exe itself crashing
# under -netdev socket on the Windows QEMU builds available during
# development (see the changelog's own account -- a QEMU/Windows
# tooling issue, not a kernel defect). This workflow runs the same
# test on Ubuntu, using a real apt-packaged QEMU release, specifically
# to get past that external blocker.
#
# Results are written to the job's step summary (GITHUB_STEP_SUMMARY)
# rather than relied on from raw step logs -- GitHub now requires an
# authenticated token to download job logs or artifacts even on public
# repos, but the step summary renders directly on the run's own page.
#
# Each QEMU instance gets its OWN copy of disk.img -- QEMU takes an
# exclusive write lock on a raw -drive image by default, so two
# processes pointed at the same file fail outright (confirmed: "Failed
# to get \"write\" lock" in an earlier run's stderr).
#
# -d int,cpu_reset,guest_errors -D <file> is also attached to every
# boot -- catches a triple fault (QEMU logs "CPU Reset", the same
# diagnostic signature this project's own Milestone 1 changelog
# already used once before) or any other CPU-level fault, independent
# of whether this kernel's own serial output ever runs at all. Needed
# because this kernel's boot-sector-level disk-read failure path
# (src/boards/pc-bios/boot.asm's disk_error label) reports errors via
# BIOS INT 10h (video teletype), which -display none makes invisible
# and which never reaches serial regardless -- an earlier attempt at
# this diagnostic used only -d guest_errors, which came back empty on
# every boot because it only logs bad DEVICE i/o, not CPU exceptions.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "src/**"
      - "tools/build-c.ps1"
      - ".github/workflows/network-test.yml"

jobs:
  two-instance-network-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (nasm, clang, lld, qemu)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang lld qemu-system-x86 seabios

      - name: Report QEMU version and firmware
        run: |
          {
            echo "## Environment"
            echo '```'
            qemu-system-x86_64 --version
            dpkg -l seabios || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Vajra
        run: pwsh tools/build-c.ps1

      # Diagnostic, not a test -- kept lightweight now that the actual
      # bug is understood and fixed (see tools/build-c.ps1's own
      # -fno-jump-tables comment for the full story: a genuine KERNEL
      # PANIC, #UD at the exact address of an unrelated .bss array,
      # traced to clang's default jump-table codegen for
      # syscall_handler's wide switch combined with this specific
      # Ubuntu ld.lld build getting one baked-in table entry wrong when
      # resolving it for a flat --oformat binary link -- never
      # reproduced on this repo's own Windows toolchain). Symbol table
      # dump kept because it's cheap and generally useful for future
      # debugging; the indirect-jump check below is a structural
      # confirmation that -fno-jump-tables actually took effect in
      # THIS build, on top of (not instead of) the real pass/fail
      # signal from the boot tests further down.
      - name: Diagnostic -- symbol table, and confirm no switch-dispatch jump table survived
        run: |
          {
            echo "## Diagnostic: kernel_debug.elf symbols (sorted by address)"
            echo '```'
            nm -n build/kernel_debug.elf | grep -v '^ *U ' || echo "(nm failed or produced nothing)"
            echo '```'
            echo "## Diagnostic: syscall_handler's own dispatch -- confirm no indirect jmp (jump table) remains"
            echo '```'
            SH_START=$(nm -n build/kernel_debug.elf | grep ' t syscall_dispatch$' | awk '{print $1}')
            SH_END=$(nm -n build/kernel_debug.elf | grep -A1 ' t syscall_dispatch$' | tail -1 | awk '{print $1}')
            if [ -n "$SH_START" ] && [ -n "$SH_END" ]; then
              DIS=$(objdump -d -M intel --start-address=0x$SH_START --stop-address=0x$SH_END build/kernel_debug.elf)
              if echo "$DIS" | grep -qE "jmp\s+(rax|r[a-z0-9]+|qword)"; then
                echo "WARNING: an indirect jmp is still present -- -fno-jump-tables may not have taken effect:"
                echo "$DIS" | grep -E "jmp\s+(rax|r[a-z0-9]+|qword)"
              else
                echo "OK: no indirect jmp found in syscall_handler's own dispatch -- plain compare-and-branch, as expected."
              fi
            else
              echo "(could not locate syscall_dispatch's own symbol bounds)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sanity check -- single instance boots at all (no networking)
        run: |
          cp build/disk.img plain-disk.img
          qemu-system-x86_64 -M pc -boot order=c \
            -drive file=plain-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -d int,cpu_reset,guest_errors -D plain.qemu-debug.log \
            -serial file:plain.log \
            > plain.stdout.log 2> plain.stderr.log &
          PID=$!
          sleep 20
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          {
            echo "## Sanity check: plain single-instance boot"
            echo "### serial log ($(wc -c < plain.log 2>/dev/null || echo 0) bytes)"
            echo '```'
            cat plain.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### qemu stderr"
            echo '```'
            cat plain.stderr.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### qemu -d int,cpu_reset,guest_errors debug log (last 20000 bytes)"
            echo '```'
            tail -c 20000 plain.qemu-debug.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Phase 10 -- every extra core really schedules actors (-smp 4)
        run: |
          cp build/disk.img smp-disk.img
          qemu-system-x86_64 -M pc -boot order=c -smp 4 \
            -drive file=smp-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -serial file:smp.log \
            > smp.stdout.log 2> smp.stderr.log &
          PID=$!
          sleep 30
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          {
            echo "## Phase 10: -smp 4 boot"
            echo '```'
            cat smp.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if grep -q "PANIC" smp.log; then echo "FAIL: kernel panic under -smp 4"; fail=1; fi
          if ! grep -q "SMP: 4 core(s) online" smp.log; then echo "FAIL: the firmware core list / staggered wake did not bring up 4 cores"; fail=1; fi
          for c in 1 2 3; do
            if ! grep -q "AP core $c\] joined the scheduler" smp.log; then echo "FAIL: core $c never joined the scheduler"; fail=1; fi
            if ! grep -q "AP core $c\] running its first actor" smp.log; then echo "FAIL: core $c never ran an actor"; fail=1; fi
          done
          if ! grep -q "Greedy\] exiting" smp.log; then echo "FAIL: the demo did not run to completion under -smp 4"; fail=1; fi
          exit $fail

      - name: Verify the Security Lab -- attacks 1-9 and the adversary campaign all HELD (keys sent through the QEMU monitor)
        run: |
          cp build/disk.img lab-disk.img
          qemu-system-x86_64 -M pc -boot order=c -smp 2 \
            -drive file=lab-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -serial file:lab.log \
            -monitor unix:lab.mon,server,nowait \
            > lab.stdout.log 2> lab.stderr.log &
          PID=$!
          sleep 30
          # F5 focuses the Security Lab (only the focused app receives keys),
          # then every attack in turn. 8 runs a program six times, so it needs
          # a few seconds; 9 waits on an accomplice actor.
          python3 - <<'PYEOF'
          import socket, time
          s = socket.socket(socket.AF_UNIX)
          s.connect("lab.mon")
          time.sleep(1)
          for k, wait in (("f5", 2), ("1", 3), ("2", 3), ("3", 3), ("4", 3), ("5", 3), ("6", 3), ("7", 3), ("8", 8), ("9", 5), ("a", 10)):
              s.sendall(("sendkey " + k + "\n").encode())
              time.sleep(wait)
          PYEOF
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          {
            echo "## Security Lab run"
            echo '```'
            cat lab.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if grep -q "PANIC" lab.log; then echo "FAIL: kernel panic"; fail=1; fi
          held=$(grep -c "HELD" lab.log || true)
          if [ "$held" -lt 9 ]; then echo "FAIL: only $held of 9 attacks reported HELD"; fail=1; fi
          if grep -q "BREACH" lab.log; then echo "FAIL: an attack reported BREACH"; fail=1; fi
          if ! grep -q "loaded and ran 6 of 6" lab.log; then echo "FAIL: attack 8 (loader pool reuse, Phase 26)"; fail=1; fi
          if ! grep -q "my old capability named a dead identity" lab.log; then echo "FAIL: attack 9 (stale capability, Phase 25)"; fail=1; fi
          if ! grep -q " 0 breaches" lab.log; then echo "FAIL: the adversary campaign did not finish with 0 breaches (Phase 31)"; fail=1; fi
          exit $fail

      - name: Verify Phase 20 -- package install through quarantine (shell commands typed through the QEMU monitor)
        run: |
          cp build/disk.img pkg-disk.img
          qemu-system-x86_64 -M pc -boot order=c -smp 2 \
            -drive file=pkg-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -serial file:pkg.log \
            -monitor unix:pkg.mon,server,nowait \
            > pkg.stdout.log 2> pkg.stderr.log &
          PID=$!
          sleep 30
          # F2 focuses the shell; then type real commands, key by key.
          python3 - <<'PYEOF'
          import socket, time
          s = socket.socket(socket.AF_UNIX)
          s.connect("pkg.mon")
          time.sleep(1)
          def key(k):
              s.sendall(("sendkey " + k + "\n").encode())
              time.sleep(0.15)
          def line(text, wait):
              for ch in text:
                  key("spc" if ch == " " else ch)
              key("ret")
              time.sleep(wait)
          key("f2")
          time.sleep(2)
          line("pkg list", 3)
          line("pkg install greeter", 6)
          line("run greeter", 4)
          line("pkg install trojan", 6)
          line("pkg list", 3)
          PYEOF
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          {
            echo "## Phase 20 package install run"
            echo '```'
            cat pkg.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if grep -q "PANIC" pkg.log; then echo "FAIL: kernel panic"; fail=1; fi
          if ! grep -q "self-check: refused to promote an object I did not stage" pkg.log; then echo "FAIL: the installer's authority is not narrow (self-check)"; fail=1; fi
          if ! grep -q "staged 'greeter'" pkg.log; then echo "FAIL: greeter was never staged"; fail=1; fi
          if ! grep -q "'greeter' is clean -- promoted to TRUSTED" pkg.log; then echo "FAIL: greeter did not pass inspection and get promoted"; fail=1; fi
          if ! grep -q "run: started as actor" pkg.log; then echo "FAIL: the installed package would not run"; fail=1; fi
          if ! grep -q "found the hostile marker in 'trojan' -- REJECTED" pkg.log; then echo "FAIL: the hostile package was not rejected"; fail=1; fi
          if grep -q "'trojan' is clean" pkg.log; then echo "FAIL: the hostile package was promoted"; fail=1; fi
          exit $fail

      - name: Verify Phase 19 -- the standard utilities (shell commands typed through the QEMU monitor)
        run: |
          cp build/disk.img util-disk.img
          qemu-system-x86_64 -M pc -boot order=c -smp 2 \
            -drive file=util-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -serial file:util.log \
            -monitor unix:util.mon,server,nowait \
            > util.stdout.log 2> util.stderr.log &
          PID=$!
          sleep 30
          python3 - <<'PYEOF'
          import socket, time
          s = socket.socket(socket.AF_UNIX)
          s.connect("util.mon")
          time.sleep(1)
          names = {" ": "spc", ".": "dot", "-": "minus"}
          def key(k):
              s.sendall(("sendkey " + k + "\n").encode())
              time.sleep(0.15)
          def line(text, wait):
              for ch in text:
                  key(names.get(ch, ch))
              key("ret")
              time.sleep(wait)
          key("f2")
          time.sleep(2)
          for cmd, wait in (("ls", 4), ("edit notes", 3), ("alpha one", 1), ("beta two", 1), ("alpha three", 1), (".", 3),
                            ("grep alpha notes", 4), ("cp notes copy", 4), ("mv copy moved", 4), ("cat moved", 4),
                            ("rm moved", 4), ("cat payload.bin", 4), ("rm cat", 4), ("count", 0.5), ("ps", 4)):
              line(cmd, wait)
          PYEOF
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          {
            echo "## Phase 19 utilities run"
            echo '```'
            cat util.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Phase 19 check -- no kernel panic
        if: always()
        run: |
          if grep -q "PANIC" util.log; then echo "FAIL: kernel panic"; exit 1; fi

      - name: Phase 19 check -- the utilities were seeded
        if: always()
        run: |
          grep -q "seeded 8 standard utilities" util.log || { echo "FAIL: utilities not seeded"; exit 1; }

      - name: Phase 19 check -- edit saves a new file
        if: always()
        run: |
          grep -q "edit: saved 31 bytes" util.log || { echo "FAIL: edit did not save the file"; exit 1; }

      - name: Phase 19 check -- grep and cat print the file
        if: always()
        run: |
          # grep and cat each print the whole line atomically; the editor echoes char by char, which other windows's serial output can interleave with
          if [ "$(grep -c "alpha three" util.log)" -lt 2 ]; then echo "FAIL: grep/cat did not print the lines"; exit 1; fi

      - name: Phase 19 check -- cp copies
        if: always()
        run: |
          grep -q "cp: copied 31 bytes" util.log || { echo "FAIL: cp failed"; exit 1; }

      - name: Phase 19 check -- mv renames
        if: always()
        run: |
          grep -q "mv: renamed" util.log || { echo "FAIL: mv failed"; exit 1; }

      - name: Phase 19 check -- rm removes
        if: always()
        run: |
          grep -q "rm: removed" util.log || { echo "FAIL: rm failed"; exit 1; }

      - name: Phase 19 check -- cat is refused on a system object
        if: always()
        run: |
          grep -q "cat: permission denied" util.log || { echo "FAIL: cat was not refused"; exit 1; }

      - name: Phase 19 check -- rm is refused on a system utility
        if: always()
        run: |
          grep -q "rm: refused" util.log || { echo "FAIL: rm was not refused"; exit 1; }

      - name: Phase 19 check -- ps lists the background job
        if: always()
        run: |
          grep -q "slot  state" util.log || { echo "FAIL: ps showed nothing"; exit 1; }

      - name: Phase 19 check -- no utility faulted
        if: always()
        run: |
          if grep -q "terminated -- fault" util.log; then echo "FAIL: a utility faulted"; exit 1; fi

      - name: Run the host bridge and serial-input session (put a 3 KB file in, use it over the serial line, take a copy out)
        run: |
          for i in $(seq 0 59); do printf 'line %03d: the quick brown fox jumps over the lazy dog\n' "$i"; done > bridge-doc.txt
          cp build/disk.img bridge-disk.img
          pwsh -File tools/vajrafs.ps1 -Image bridge-disk.img -Put bridge-doc.txt -As document-with-long-name
          qemu-system-x86_64 -M pc -boot order=c -smp 2 \
            -drive file=bridge-disk.img,format=raw,if=ide \
            -display none -no-reboot \
            -serial unix:bridge.ser,server,nowait \
            -monitor unix:bridge.mon,server,nowait \
            > bridge.stdout.log 2> bridge.stderr.log &
          PID=$!
          sleep 3
          python3 - <<'PYEOF'
          import socket, time, threading
          def conn(path):
              for _ in range(60):
                  try:
                      s = socket.socket(socket.AF_UNIX)
                      s.connect(path)
                      return s
                  except OSError:
                      time.sleep(0.5)
              raise SystemExit("cannot connect " + path)
          ser = conn("bridge.ser")
          mon = conn("bridge.mon")
          out = open("bridge.log", "wb")
          def reader():
              while True:
                  d = ser.recv(4096)
                  if not d:
                      return
                  out.write(d)
                  out.flush()
          threading.Thread(target=reader, daemon=True).start()
          time.sleep(30)
          mon.sendall(b"sendkey f2" + bytes([10]))   # focus the shell; everything else is typed over the serial line
          time.sleep(2)
          for cmd in ("ls", "cat document-with-long-name", "grep 059 document-with-long-name",
                      "cp document-with-long-name copied-doc", "ls"):
              ser.sendall(cmd.encode() + bytes([13]))
              time.sleep(5)
          PYEOF
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          pwsh -File tools/vajrafs.ps1 -Image bridge-disk.img -Get copied-doc -Out bridge-copy.txt || true
          {
            echo "## Host bridge session"
            echo '```'
            cat bridge.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bridge check -- the imported 23-character name is listed
        if: always()
        run: |
          grep -q "document-with-long-name" bridge.log || { echo "FAIL: imported file not listed"; exit 1; }

      - name: Bridge check -- serial-typed commands ran (text typed over COM1 reaches the shell)
        if: always()
        run: |
          grep -q "cp: copied 3240 bytes" bridge.log || { echo "FAIL: the serial-typed cp did not run"; exit 1; }

      - name: Bridge check -- a 3 KB file prints in full (offset reads across chunks)
        if: always()
        run: |
          grep -q "line 000:" bridge.log && grep -q "line 059:" bridge.log || { echo "FAIL: cat did not print the whole file"; exit 1; }

      - name: Bridge check -- grep finds a line late in a multi-chunk file
        if: always()
        run: |
          [ "$(grep -c 'line 059: the quick' bridge.log)" -ge 2 ] || { echo "FAIL: grep did not print the matching line"; exit 1; }

      - name: Bridge check -- the copy taken back out equals the original byte for byte
        if: always()
        run: |
          cmp bridge-doc.txt bridge-copy.txt || { echo "FAIL: exported copy differs"; exit 1; }

      - name: Boot two instances joined by a direct network link
        if: always()
        run: |
          cp build/disk.img peerA-disk.img
          cp build/disk.img peerB-disk.img

          qemu-system-x86_64 -M pc -boot order=c \
            -drive file=peerA-disk.img,format=raw,if=ide \
            -netdev socket,id=n0,listen=:12345 \
            -device virtio-net-pci,netdev=n0,mac=52:54:00:aa:00:0a \
            -display none -no-reboot \
            -d int,cpu_reset,guest_errors -D peerA.qemu-debug.log \
            -serial file:peerA.log \
            -monitor unix:peerA.mon,server,nowait \
            > peerA.stdout.log 2> peerA.stderr.log &
          PID_A=$!

          # 1s, not 3 -- the listen= socket binds at QEMU's own device
          # realization, milliseconds after process start, long before
          # the guest even begins executing boot.asm. The real fix for
          # cross-instance overlap is core/main.c's own listening
          # window (see actor_network_peer's comment), not this
          # stagger -- this just needs to outlast QEMU's own startup,
          # not the guest's boot+scheduler time.
          sleep 1

          qemu-system-x86_64 -M pc -boot order=c \
            -drive file=peerB-disk.img,format=raw,if=ide \
            -netdev socket,id=n0,connect=127.0.0.1:12345 \
            -device virtio-net-pci,netdev=n0,mac=52:54:00:bb:00:0b \
            -display none -no-reboot \
            -d int,cpu_reset,guest_errors -D peerB.qemu-debug.log \
            -serial file:peerB.log \
            > peerB.stdout.log 2> peerB.stderr.log &
          PID_B=$!

          # 90s, not 60 -- actor_network_peer's own listening window
          # doubled (20 attempts x 2,000,000 spins, up from 10) to fix
          # a timing-mismatch bug, and the earlier 60s sleep here may
          # now cut both instances off before that window naturally
          # closes on its own.
          # Wait until Peer A's Fabric actor has finished its handshake and
          # entered its interactive loop (it prints a banner then) -- a fixed
          # sleep guessed wrong once -- for at most 150 s.
          for i in $(seq 1 150); do
            if grep -q "\[Net\] interactive:" peerA.log 2>/dev/null; then break; fi
            sleep 1
          done

          # The Fabric app's keyboard interface, driven for real: F6 brings
          # the Fabric window to the front, then p pings the peer and r asks
          # it to run hello.bin -- all through Peer A's virtual keyboard.
          python3 - <<'PYEOF'
          import socket, time
          s = socket.socket(socket.AF_UNIX)
          s.connect("peerA.mon")
          time.sleep(1)
          for k in ("f6", "h", "p", "r"):
              s.sendall(("sendkey " + k + "\n").encode())
              time.sleep(4)
          PYEOF

          sleep 20

          kill "$PID_A" "$PID_B" 2>/dev/null || true
          wait "$PID_A" "$PID_B" 2>/dev/null || true

      - name: Show both peers' full boot logs
        if: always()
        run: |
          {
            echo "## Two-instance test"
            echo "### Peer A (listen=) serial log ($(wc -c < peerA.log 2>/dev/null || echo 0) bytes)"
            echo '```'
            cat peerA.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### Peer A stderr"
            echo '```'
            cat peerA.stderr.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### Peer A qemu debug log"
            echo '```'
            tail -c 20000 peerA.qemu-debug.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### Peer B (connect=) serial log ($(wc -c < peerB.log 2>/dev/null || echo 0) bytes)"
            echo '```'
            cat peerB.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### Peer B stderr"
            echo '```'
            cat peerB.stderr.log 2>/dev/null || echo "(no file)"
            echo '```'
            echo "### Peer B qemu debug log"
            echo '```'
            tail -c 20000 peerB.qemu-debug.log 2>/dev/null || echo "(no file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify a genuine cross-instance HELLO/HELLO_ACK exchange
        if: always()
        run: |
          if grep -q "genuine cross-device actor communication confirmed" peerA.log peerB.log 2>/dev/null; then
            echo "## Result: PASS (addressing)" >> "$GITHUB_STEP_SUMMARY"
            echo "A real HELLO_ACK crossed the device boundary between two separate QEMU instances." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Result: FAIL (addressing)" >> "$GITHUB_STEP_SUMMARY"
            echo "Neither instance reported hearing a HELLO_ACK from the other." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify genuine reliable delivery (ACK + retry)
        if: always()
        run: |
          if grep -q "PING genuinely acked by the peer -- reliable delivery confirmed" peerA.log peerB.log 2>/dev/null; then
            echo "## Result: PASS (reliability)" >> "$GITHUB_STEP_SUMMARY"
            echo "The reliable-send primitive's own delivery confirmation crossed the device boundary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Result: FAIL (reliability)" >> "$GITHUB_STEP_SUMMARY"
            echo "Neither instance reported a confirmed reliable PING delivery." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify Phase 13a -- a remote spawn request genuinely ran on the peer's own device
        if: always()
        run: |
          if grep -q "a program I named is now genuinely executing on a DIFFERENT device" peerA.log peerB.log 2>/dev/null; then
            echo "## Result: PASS (Phase 13a remote spawn)" >> "$GITHUB_STEP_SUMMARY"
            echo "A device's MSG_NET_SPAWN_REQUEST caused the PEER to load and run hello.bin using only the peer's own local capabilities -- confirmed by the peer's own MSG_NET_SPAWN_REPLY crossing back." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Result: FAIL (Phase 13a remote spawn)" >> "$GITHUB_STEP_SUMMARY"
            echo "Neither instance reported a confirmed remote spawn." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify the two peers really have distinct MAC addresses
        if: always()
        run: |
          # Before this, both instances reported the same MAC, so "a frame
          # from the peer" could not be told apart from the machine's own.
          grep -qi "MAC 52:54:00:aa:00:0a" peerA.log || { echo "FAIL: Peer A did not report its assigned MAC"; exit 1; }
          grep -qi "MAC 52:54:00:bb:00:0b" peerB.log || { echo "FAIL: Peer B did not report its assigned MAC"; exit 1; }
          # and each must have heard the OTHER's address as a sender
          grep -qi "52:54:00:bb:00:0b" peerA.log || { echo "FAIL: Peer A never saw Peer B's MAC as a sender"; exit 1; }
          grep -qi "52:54:00:aa:00:0a" peerB.log || { echo "FAIL: Peer B never saw Peer A's MAC as a sender"; exit 1; }

      - name: Fabric app -- the actor reached its interactive loop
        if: always()
        run: |
          grep -q "\[Net\] interactive:" peerA.log || { echo "FAIL: Peer A's Fabric actor never reached its interactive loop"; exit 1; }

      - name: Fabric app -- the keys (F6 focus, h) really reach the actor
        if: always()
        run: |
          grep -q "key h: broadcasting HELLO" peerA.log || { echo "FAIL: key h never reached Peer A's Fabric actor (F6 focus or keyboard delivery)"; exit 1; }

      - name: Fabric app -- Peer A knows its peer by the time p is pressed
        if: always()
        run: |
          if grep -q "key p/r: no peer known yet" peerA.log; then echo "FAIL: Peer A had no peer address when p/r was pressed"; exit 1; fi

      - name: Fabric app -- key p pings the peer (delivery confirmed)
        if: always()
        run: |
          grep -q "key p: PING acked by the peer" peerA.log || { echo "FAIL: key p never produced a confirmed ping"; exit 1; }

      - name: Fabric app -- key r asks the peer to run hello.bin
        if: always()
        run: |
          grep -q "key r: asking the peer" peerA.log || { echo "FAIL: key r never reached the Fabric actor"; exit 1; }
          grep -q "key r: request delivered" peerA.log || { echo "FAIL: key r's spawn request was never acked"; exit 1; }

